name: CI & Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR Title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  lint-and-types:
    name: Lint & Type Check (uv + ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Setup Python 3.12
        run: uv python install 3.12
      - name: Install dependencies with uv
        run: uv sync --all-extras --dev
      - name: Run Ruff Lint
        run: uv run ruff check slim_video/ tests/
      - name: Run Ruff Format Check
        run: uv run ruff format --check slim_video/ tests/
      - name: Run Mypy Static Type Analysis
        run: uv run mypy slim_video/

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    needs: [lint-and-types]
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install system dependencies
        run: brew install ffmpeg
      - name: Install package with dev dependencies
        run: uv sync --all-extras --dev
      - name: Run Doctor Hardware Diagnostics
        run: uv run slim-video doctor
      - name: Run Pytest Suite
        run: uv run pytest tests/ -v --tb=short
