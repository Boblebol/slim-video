[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-video"
version = "1.4.0"
description = "Smart, hardware-accelerated H.264 to HEVC/x265 batch transcoder for Apple Silicon with sample estimation & collapsible TUI."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alexandre Enouf", email = "alexandre.enouf@gmail.com" }
]
keywords = ["slim-video", "hevc", "h265", "h264", "ffmpeg", "transcoder", "videotoolbox", "apple-silicon", "cli", "tui", "pydantic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.8",
    "InquirerPy>=0.3.4",
    "pydantic>=2.0",
    "eval-type-backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
slim-video = "slim_video.cli:main"
hevc-cli = "slim_video.cli:main"

[project.urls]
Homepage = "https://alexandre-enouf.fr"
Repository = "https://github.com/Boblebol/slim-video"
Issues = "https://github.com/Boblebol/slim-video/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["slim_video*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "InquirerPy.*"
ignore_missing_imports = true
implicit_reexport = true
